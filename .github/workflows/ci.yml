on:
  pull_request:
  push:

# Never cancel a run that may be mid-deploy. Superseded pull request checks are
# safe to drop; a push to master is not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flake-check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    name: Nix flake check ${{matrix.os}}
    runs-on: ${{matrix.os}}
    steps:
      - uses: wimpysworld/nothing-but-nix@main
        if: matrix.os == 'ubuntu-latest'
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: actions/checkout@v5
      - run: nix flake metadata
      - run: |
          cat <<-EOF > modules/ci-runtime.nix
          {
            _module.args.CI = true;
          }
          EOF
      - run: nix flake check --impure

  # `needs` is the gate: every matrix leg of flake-check must succeed for this
  # job to start, and it runs against the same commit. Keeping both jobs in one
  # workflow is what makes that ordering enforceable -- `needs` cannot reach
  # across workflow files, and chaining via `workflow_run` would run with
  # secrets on a trigger that fork activity can reach.
  #
  # `push` to master only, so a fork cannot reach the self-hosted runner.
  deploy:
    needs: flake-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    name: Deploy @auto
    runs-on: [self-hosted, nix-config]
    steps:
      - uses: actions/checkout@v5
      - run: colmena build --on @auto
      - run: colmena apply --on @auto
