name: deploy

# Only `push` to master, never `pull_request`. A fork cannot trigger this, so
# the self-hosted runner never executes code from an untrusted PR -- the hazard
# GitHub warns about for self-hosted runners on public repositories.
on:
  push:
    branches: [master]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, nix-config]
    steps:
      - uses: actions/checkout@v5

      - name: Build the hive
        run: colmena build --on @auto

      - name: Apply
        run: colmena apply --on @auto
